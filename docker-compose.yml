services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-xyz_football}
    ports:
      # Port yang di-expose ke HOST diambil dari DB_PORT di .env (default 5432).
      # Di dalam jaringan docker-compose, api tetap selalu connect ke postgres:5432
      # (lihat environment: DB_HOST/DB_PORT di service api) — jadi nilai ini hanya
      # perlu diubah kalau port 5432 di host sudah dipakai proses lain (mis. Postgres
      # native/systemd), tanpa mempengaruhi koneksi antar-container.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  pgdata:
